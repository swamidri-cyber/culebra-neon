<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culebra Neón</title>
<style>
  :root { --bg:#0b0b14; --fg:#e8e8ff; --snake:#39ff88; --food:#ff3ea5; --grid:#16162a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:12px; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; padding:16px; touch-action:none; }
  h1 { margin:0; font-size:28px; letter-spacing:2px; color:var(--snake); text-shadow:0 0 12px var(--snake); }
  .hud { display:flex; gap:24px; font-size:16px; }
  .hud b { color:var(--food); }
  canvas { width:min(92vw, 480px); aspect-ratio:1; border-radius:12px; background:var(--grid);
           box-shadow:0 0 24px #39ff8840, inset 0 0 0 2px #39ff8860; }
  .msg { min-height:1.4em; opacity:.85; text-align:center; }
</style>
</head>
<body>
  <h1>CULEBRA NEÓN</h1>
  <div class="hud">
    <span>Puntos: <b id="score">0</b></span>
    <span>Récord: <b id="best">0</b></span>
  </div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="msg" id="msg">Pulsa Espacio o toca para empezar · Flechas/WASD o desliza · P para pausar</div>

<script>
const N = 20, canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const S = canvas.width / N;
const $score = document.getElementById('score'), $best = document.getElementById('best'), $msg = document.getElementById('msg');

let best = 0;
try { best = +localStorage.getItem('culebra-best') || 0; } catch {}
$best.textContent = best;

let snake, dir, queue, food, score, speed, state = 'idle', last = 0, particles = [];

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; queue = []; score = 0; speed = 120;
  $score.textContent = 0; placeFood();
}

function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function turn(x, y) {
  const d = queue.length ? queue[queue.length-1] : dir;
  if (d.x === -x && d.y === -y) return;   // no se puede dar media vuelta
  if (d.x === x && d.y === y) return;
  if (queue.length < 3) queue.push({x, y});
}

function start() { reset(); state = 'play'; $msg.textContent = ''; }

function step() {
  if (queue.length) dir = queue.shift();
  const head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; $score.textContent = score;
    speed = Math.max(55, speed - 3);
    burst(food.x, food.y);
    placeFood();
  } else snake.pop();
}

function gameOver() {
  state = 'over';
  if (score > best) {
    best = score; $best.textContent = best;
    try { localStorage.setItem('culebra-best', best); } catch {}
    $msg.textContent = `¡Nuevo récord: ${score}! Espacio o toca para repetir`;
  } else $msg.textContent = `Fin del juego (${score}). Espacio o toca para repetir`;
}

function burst(gx, gy) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
    particles.push({x:(gx+.5)*S, y:(gy+.5)*S, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1});
  }
}

function draw(t) {
  ctx.fillStyle = '#16162a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1d1d36';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    if ((i + j) % 2) ctx.fillRect(i*S, j*S, S, S);

  if (!snake) return;
  // comida que late
  const pulse = 1 + Math.sin(t / 150) * .15;
  ctx.shadowBlur = 20; ctx.shadowColor = '#ff3ea5'; ctx.fillStyle = '#ff3ea5';
  ctx.beginPath(); ctx.arc((food.x+.5)*S, (food.y+.5)*S, S*.35*pulse, 0, Math.PI*2); ctx.fill();

  // culebra con degradado de color
  ctx.shadowColor = '#39ff88';
  snake.forEach((s, i) => {
    const k = 1 - i / (snake.length + 4);
    ctx.fillStyle = `hsl(${145 - i*2}, 100%, ${40 + k*25}%)`;
    ctx.shadowBlur = i === 0 ? 20 : 8;
    const p = i === 0 ? 1 : 2;
    ctx.beginPath(); ctx.roundRect(s.x*S+p, s.y*S+p, S-p*2, S-p*2, 6); ctx.fill();
  });
  // ojos
  ctx.shadowBlur = 0; ctx.fillStyle = '#0b0b14';
  const h = snake[0], ex = dir.y ? .25 : 0, ey = dir.x ? .25 : 0;
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    ctx.arc((h.x+.5+dir.x*.2+ex*sgn)*S, (h.y+.5+dir.y*.2+ey*sgn)*S, S*.09, 0, Math.PI*2);
    ctx.fill();
  }

  // partículas
  particles = particles.filter(p => (p.life -= .03) > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    ctx.globalAlpha = p.life; ctx.fillStyle = '#ff3ea5';
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function loop(t) {
  if (state === 'play' && t - last > speed) { last = t; step(); }
  draw(t);
  requestAnimationFrame(loop);
}

const keys = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
addEventListener('keydown', e => {
  const k = keys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (k) { e.preventDefault(); if (state === 'play') turn(...k); return; }
  if (e.key === ' ') { e.preventDefault(); if (state !== 'play' && state !== 'paused') start(); }
  if (e.key.toLowerCase() === 'p') {
    if (state === 'play') { state = 'paused'; $msg.textContent = 'Pausa — pulsa P para seguir'; }
    else if (state === 'paused') { state = 'play'; $msg.textContent = ''; }
  }
});

// controles táctiles: deslizar para girar, tocar para empezar
let tx, ty;
addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
addEventListener('pointerup', e => {
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.hypot(dx, dy) < 20) { if (state === 'idle' || state === 'over') start(); return; }
  if (state !== 'play') return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});

reset(); state = 'idle';
requestAnimationFrame(loop);
</script>
</body>
</html>
